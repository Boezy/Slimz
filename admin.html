<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SLIMZ Admin</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f7f2e8;--card:#fff;--line:#e2d8c3;--mute:#7a6f5c;--neon:#e8b94a;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#221d14;font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:1200px;margin:auto}
h1,h2{margin:.4em 0}button,input,select{font:inherit}
input,select{background:#fff;border:1px solid var(--line);border-radius:10px;color:#221d14;padding:8px}
.btn{background:var(--neon);color:#050505;border:0;border-radius:20px;padding:9px 16px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{background:#fff;color:#221d14;border:1px solid var(--line);border-radius:20px;padding:8px 16px;cursor:pointer}.tabs .on{background:var(--neon);color:#050505}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.k{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}.k b{display:block;font-size:26px;color:var(--neon)}.k span{color:var(--mute);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:14px 0}.bars div{flex:1;background:var(--neon);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bars small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:var(--mute);font-size:10px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:13px}td input{width:90px}
#login{max-width:340px;margin:20vh auto;display:grid;gap:10px}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}
.tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;white-space:nowrap}
@media(max-width:700px){
 body{padding:12px}h1{font-size:24px}
 table,tbody,tr,td{display:block;width:100%}table{min-width:0!important}
 tr:has(th){display:none}
 tr{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
 td{border:0;padding:5px 0}td[data-l]:before{content:attr(data-l);display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
 td input:not([type=checkbox]),td select{width:100%!important;max-width:100%}
 .kpis{grid-template-columns:1fr 1fr}.k b{font-size:21px}.bars{height:110px;padding:10px}.btn{padding:10px 14px}#login{margin:12vh auto}
}
</style></head><body>
<div id="login" hidden><h1>SLIMZ Admin</h1><input id="e" type="email" placeholder="E-mail" autocomplete="username"><input id="p" type="password" placeholder="Wachtwoord" autocomplete="current-password"><button class="btn" id="go">Inloggen</button><div id="err" style="color:#ff6b6b"></div></div>
<div id="app" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h1>SLIMZ Admin</h1><div><a href="index.html" style="color:var(--mute);margin-right:12px;font-size:14px">← Shop</a><button class="btn" id="out">Uitloggen</button></div></div>
<div class="tabs"><button data-t="dash" class="on">Dashboard</button><button data-t="orders">Bestellingen</button><button data-t="prods">Producten</button><button data-t="codes">Kortingscodes</button><button data-t="variants">Varianten</button><button data-t="service">Service</button><button data-t="cust">Klanten & punten</button></div>
<section id="dash"></section><section id="orders" hidden></section><section id="prods" hidden></section><section id="cust" hidden></section><section id="codes" hidden></section><section id="variants" hidden></section><section id="service" hidden></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s),eur=v=>"€"+Number(v||0).toFixed(2).replace(".",",");let sb;
$("#go").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("#e").value,password:$("#p").value});if(error)$("#err").textContent=error.message;else boot()};
$("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));["dash","orders","prods","cust","codes","service","variants"].forEach(t=>$("#"+t).hidden=t!=b.dataset.t)});
async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){$("#login").hidden=false;return}
 const {data:me}=await sb.from("profiles").select("is_admin").eq("id",user.id).single();
 if(!me?.is_admin){$("#login").hidden=false;$("#err").textContent="Dit account ("+user.email+") heeft geen admin-rechten.";return}
 $("#login").hidden=true;$("#app").hidden=false;load();
}
async function load(){
 const since=new Date(Date.now()-30*864e5).toISOString();
 const [o,it,pr,v,cu,dc,rt,rv,al,vr]=await Promise.all([sb.from("orders").select("*").order("created_at",{ascending:false}),sb.from("order_items").select("*"),sb.from("products").select("*").order("sku"),sb.from("visits").select("created_at,session,source").gte("created_at",since),sb.from("profiles").select("*").order("points",{ascending:false}),sb.from("discount_codes").select("*").order("code"),sb.from("returns").select("*").order("created_at",{ascending:false}),sb.from("reviews").select("*").order("created_at",{ascending:false}).limit(50),sb.from("stock_alerts").select("*").order("created_at",{ascending:false}),sb.from("variants").select("*").order("sku").order("sort")]);
 const orders=o.data||[],items=it.data||[],prods=pr.data||[],visits=v.data||[],custs=cu.data||[];
 const paid=orders.filter(x=>["paid","shipped"].includes(x.status)),rev=paid.reduce((a,x)=>a+Number(x.total),0);
 const ids=new Set(paid.map(x=>x.id)),cost=items.filter(i=>ids.has(i.order_id)).reduce((a,i)=>a+(prods.find(p=>p.sku==i.sku)?.cost||0)*i.qty,0);
 const today=new Date().toDateString(),vt=visits.filter(x=>new Date(x.created_at).toDateString()==today).length,uniq=new Set(visits.map(x=>x.session)).size;
 const days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*864e5);return{l:d.getDate(),n:visits.filter(x=>new Date(x.created_at).toDateString()==d.toDateString()).length}}),mx=Math.max(1,...days.map(d=>d.n));
 const K=(b,s)=>`<div class="k"><b>${b}</b><span>${s}</span></div>`;
 $("#dash").innerHTML=`<div class="kpis">${K(vt,"Bezoeken vandaag")}${K(visits.length,"Bezoeken (30 dagen)")}${K(uniq,"Unieke bezoekers (30 d)")}${K(paid.length,"Betaalde bestellingen")}${K(eur(rev),"Omzet incl. btw")}${K(eur(rev-cost),"Brutowinst (omzet − inkoop)")}${K(paid.length?eur(rev/paid.length):"–","Gem. orderwaarde")}${K(uniq?(paid.length/uniq*100).toFixed(1)+"%":"–","Conversie")}${K(paid.reduce((a,x)=>a+x.points_earned,0),"Punten uitgegeven")}${K(custs.length,"Klantaccounts")}${K(orders.filter(x=>x.status=="paid").length,"Te verzenden")}${K(prods.filter(p=>p.stock<=3&&p.active).length,"Bijna uitverkocht")}</div><h2>Bezoeken laatste 14 dagen</h2><div class="bars" style="margin-bottom:34px">${days.map(d=>`<div style="height:${d.n/mx*100}%" title="${d.n}"><small>${d.l}</small></div>`).join("")}</div>`;
 {const m={};visits.forEach(x=>{const k=x.source||"onbekend";m[k]=(m[k]||0)+1});$("#dash").innerHTML+=`<h2>Bezoekers per bron (30 dagen)</h2><div class="wrap"><table><tr><th>Bron</th><th>Bezoeken</th></tr>${Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join("")}</table></div>`}
 $("#orders").innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="os" placeholder="Zoek op naam, e-mail of nummer" style="flex:1;margin:0"><button class="btn" id="csv">CSV</button></div><div class="wrap"><table><tr><th>Datum</th><th>Klant</th><th>Producten</th><th>Totaal</th><th>Punten</th><th>Status</th></tr>${orders.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("nl-NL")}</td><td>${esc(x.name)}<br><small>${esc(x.email)}${x.phone?" · "+esc(x.phone):""}<br>${esc(x.address)}${x.note?"<br><b>Opmerking:</b> "+esc(x.note):""}${x.code?"<br>Code: "+esc(x.code):""}</small></td><td>${items.filter(i=>i.order_id==x.id).map(i=>i.qty+"× "+i.sku+(i.variant_label?" ("+esc(i.variant_label)+")":"")).join(", ")}</td><td>${eur(x.total)}</td><td>+${x.points_earned} / −${x.points_used}</td><td><select data-o="${x.id}">${["pending","paid","shipped","refunded","failed"].map(s=>`<option ${s==x.status?"selected":""}>${s}</option>`).join("")}</select><br><button data-inv="${x.id}" style="margin-top:6px;padding:4px 10px;background:#fff;color:#000;border-radius:8px;border:0;cursor:pointer">Factuur</button>${x.tracking?"<br><small>"+esc(x.tracking)+"</small>":""}</td></tr>`).join("")}</table></div>`;
 document.querySelectorAll("[data-o]").forEach(s=>s.onchange=async()=>{if(s.value=="shipped"){const tr=prompt("Track & trace-code (leeg laten mag):")??"";const tk=(await sb.auth.getSession()).data.session.access_token;const r=await fetch("/.netlify/functions/shop",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tk,apikey:CFG.key},body:JSON.stringify({action:"shipped",id:s.dataset.o,tracking:tr.trim()})});if(!r.ok)alert("Verzonden zetten mislukt.")}else await sb.from("orders").update({status:s.value}).eq("id",s.dataset.o);load()});
 document.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>{const x=orders.find(o=>o.id==b.dataset.inv),its=items.filter(i=>i.order_id==x.id),c=CFG.co||{},btw=x.total-x.total/1.21,w=open("","_blank");
  w.document.write(`<!doctype html><meta charset=utf-8><title>Factuur</title><style>body{font:14px system-ui;max-width:720px;margin:40px auto;padding:0 16px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ccc;text-align:left}td:last-child,th:last-child{text-align:right}</style><h1>Factuur F-${new Date(x.created_at).getFullYear()}-${esc(x.id.slice(0,6).toUpperCase())}</h1><p>${esc(c.name)}<br>${esc(c.addr)}<br>KvK ${esc(c.kvk)} · BTW ${esc(c.btw)}</p><p>Datum: ${new Date(x.created_at).toLocaleDateString("nl-NL")}<br>Aan: ${esc(x.name)}<br>${esc(x.address)}</p><table><tr><th>Product</th><th>Aantal</th><th>Bedrag</th></tr>${its.map(i=>`<tr><td>${esc((prods.find(p=>p.sku==i.sku)||{}).name||i.sku)+(i.variant_label?' - '+esc(i.variant_label):'')}</td><td>${i.qty}</td><td>${eur(i.price*i.qty)}</td></tr>`).join("")}<tr><td>Verzending</td><td></td><td>${eur(x.shipping)}</td></tr>${x.code_discount>0?`<tr><td>Kortingscode ${esc(x.code)}</td><td></td><td>-${eur(x.code_discount)}</td></tr>`:""}${x.discount>0?`<tr><td>Puntenkorting</td><td></td><td>-${eur(x.discount)}</td></tr>`:""}<tr><td colspan=2><b>Totaal incl. btw</b></td><td><b>${eur(x.total)}</b></td></tr><tr><td colspan=2>Waarvan 21% btw</td><td>${eur(btw)}</td></tr></table><p><button onclick="print()">Afdrukken</button></p>`);w.document.close()});
 $("#prods").innerHTML=`<button class="btn" id="np">+ Nieuw product</button><div class="wrap"><table><tr><th>SKU</th><th>Naam</th><th>Prijs</th><th>Inkoop</th><th>Voorraad</th><th>Foto-URL</th><th>Actief</th></tr>${prods.map(p=>`<tr><td>${p.sku}</td><td><input data-k="name" data-s="${p.sku}" value="${p.name}" style="width:280px"></td><td><input data-k="price" data-s="${p.sku}" type="number" step=".01" value="${p.price}"></td><td><input data-k="cost" data-s="${p.sku}" type="number" step=".01" value="${p.cost}"></td><td><input data-k="stock" data-s="${p.sku}" type="number" value="${p.stock}"></td><td><input data-k="image_url" data-s="${p.sku}" value="${p.image_url||""}" placeholder="https://…" style="width:200px"></td><td><input data-k="active" data-s="${p.sku}" type="checkbox" ${p.active?"checked":""} style="width:auto"></td></tr>`).join("")}</table></div>`;
 document.querySelectorAll("#prods [data-k]").forEach(i=>i.onchange=async()=>{const k=i.dataset.k;await sb.from("products").update({[k]:k=="active"?i.checked:k=="name"||k=="image_url"?i.value:Number(i.value)}).eq("sku",i.dataset.s)});
 $("#np").onclick=async()=>{const sku=prompt("SKU:"),name=prompt("Naam:"),price=Number(prompt("Prijs:"));if(sku&&name&&price){await sb.from("products").insert({sku,name,price,category:"Overig",stock:0});load()}};
 $("#cust").innerHTML=`<div class="wrap"><table><tr><th>E-mail</th><th>Punten</th><th>Punten aanpassen</th></tr>${custs.map(c=>`<tr><td>${esc(c.email)}</td><td>${c.points}</td><td><input type="number" value="${c.points}" data-c="${c.id}"></td></tr>`).join("")}</table></div>`;
 document.querySelectorAll("[data-c]").forEach(i=>i.onchange=async()=>{await sb.from("profiles").update({points:Number(i.value)}).eq("id",i.dataset.c);load()});

 $("#codes").innerHTML=`<button class="btn" id="nc">+ Nieuwe code</button><div class="wrap"><table><tr><th>Code</th><th>Korting</th><th>Min. bestelling</th><th>Gebruikt</th><th>Actief</th><th></th></tr>${(dc.data||[]).map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${c.percent?c.percent+"%":eur(c.amount)}</td><td>${eur(c.min_order)}</td><td>${c.uses}${c.max_uses?" / "+c.max_uses:""}</td><td><input type="checkbox" data-cc="${esc(c.code)}" ${c.active?"checked":""} style="width:auto"></td><td><button class="btn" data-cd="${esc(c.code)}" style="background:#a33;color:#fff;padding:5px 12px">Verwijder</button></td></tr>`).join("")}</table></div>`;
 $("#nc").onclick=async()=>{const code=(prompt("Code (bijv. ZOMER15):")||"").trim().toUpperCase();if(!code)return;const pct=Number(prompt("Percentage korting (leeg laten voor vast bedrag):")||0),amt=pct?null:Number(prompt("Vast bedrag in euro:")||0),min=Number(prompt("Minimale bestelling in euro (0 = geen):")||0);if(!pct&&!amt)return;await sb.from("discount_codes").insert({code,percent:pct||null,amount:amt,min_order:min});load()};
 document.querySelectorAll("[data-cc]").forEach(i=>i.onchange=async()=>{await sb.from("discount_codes").update({active:i.checked}).eq("code",i.dataset.cc)});
 document.querySelectorAll("[data-cd]").forEach(b=>b.onclick=async()=>{if(confirm("Code verwijderen?")){await sb.from("discount_codes").delete().eq("code",b.dataset.cd);load()}});

 const RS=["aangevraagd","goedgekeurd","ontvangen","terugbetaald","afgewezen"];
 $("#service").innerHTML=`<h2>Retouren</h2><div class="wrap"><table><tr><th>Datum</th><th>Bestelling</th><th>Reden</th><th>Status</th></tr>${(rt.data||[]).map(r=>`<tr><td>${new Date(r.created_at).toLocaleDateString("nl-NL")}</td><td>#${esc(String(r.order_id).slice(0,8))}</td><td>${esc(r.reason)}</td><td><select data-rt="${r.id}">${RS.map(x=>`<option ${x==r.status?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")||"<tr><td colspan=4>Geen retouren.</td></tr>"}</table></div>
 <h2 style="margin-top:28px">Voorraadmeldingen</h2><div class="wrap"><table><tr><th>Product</th><th>E-mail</th><th>Sinds</th><th></th></tr>${(al.data||[]).map(a=>`<tr><td>${esc(a.sku)}</td><td>${esc(a.email)}</td><td>${new Date(a.created_at).toLocaleDateString("nl-NL")}</td><td><button class="btn" data-ad="${a.id}" style="padding:4px 10px">Klaar</button></td></tr>`).join("")||"<tr><td colspan=4>Geen meldingen.</td></tr>"}</table></div>
 <h2 style="margin-top:28px">Reviews</h2><div class="wrap"><table><tr><th>Product</th><th>Score</th><th>Tekst</th><th></th></tr>${(rv.data||[]).map(r=>`<tr><td>${esc(r.sku)}</td><td>${r.rating}/5</td><td>${esc(r.name)}: ${esc(r.body)}</td><td><button class="btn" data-rd="${r.id}" style="background:#a33;color:#fff;padding:4px 10px">Verwijder</button></td></tr>`).join("")||"<tr><td colspan=4>Nog geen reviews.</td></tr>"}</table></div>`;
 document.querySelectorAll("[data-rt]").forEach(s=>s.onchange=async()=>{await sb.from("returns").update({status:s.value}).eq("id",s.dataset.rt)});
 document.querySelectorAll("[data-ad]").forEach(b=>b.onclick=async()=>{await sb.from("stock_alerts").delete().eq("id",b.dataset.ad);load()});
 document.querySelectorAll("[data-rd]").forEach(b=>b.onclick=async()=>{if(confirm("Review verwijderen?")){await sb.from("reviews").delete().eq("id",b.dataset.rd);load()}});

 document.querySelectorAll("table").forEach(t=>{const h=[...t.querySelectorAll("th")].map(x=>x.textContent);t.querySelectorAll("tr").forEach(r=>[...r.children].forEach((c,i)=>{if(c.tagName=="TD"&&h[i])c.dataset.l=h[i]}))});

 $("#os").oninput=()=>{const q=$("#os").value.toLowerCase();document.querySelectorAll("#orders table tr").forEach((r,i)=>{if(i)r.hidden=!!q&&!r.textContent.toLowerCase().includes(q)})};
 $("#csv").onclick=()=>{const fx=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};const rows=[["datum","bestelling","naam","email","telefoon","adres","status","totaal","code"],...orders.map(x=>[x.created_at,x.id.slice(0,8),x.name,x.email,x.phone||"",x.address,x.status,x.total,x.code||""])];const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(fx).join(";")).join("\n")],{type:"text/csv"}));a.download="bestellingen.csv";a.click()};

 $("#variants").innerHTML=`<p class="m">Heeft een product varianten, dan telt de voorraad per variant. Prijs +/− is het verschil met de basisprijs.</p><button class="btn" id="nvr">+ Variant</button><div class="wrap"><table><tr><th>Product</th><th>Variant</th><th>Voorraad</th><th>Prijs +/−</th><th>Actief</th><th></th></tr>${(vr.data||[]).map(v=>`<tr><td>${esc(v.sku)}</td><td><input data-vk="label" data-vi="${v.id}" value="${esc(v.label)}"></td><td><input type="number" data-vk="stock" data-vi="${v.id}" value="${v.stock}"></td><td><input type="number" step=".01" data-vk="price_delta" data-vi="${v.id}" value="${v.price_delta}"></td><td><input type="checkbox" data-vk="active" data-vi="${v.id}" ${v.active?"checked":""} style="width:auto"></td><td><button class="btn" data-vd="${v.id}" style="background:#a33;color:#fff;padding:4px 10px">Verwijder</button></td></tr>`).join("")}</table></div>`;
 document.querySelectorAll("[data-vk]").forEach(x=>x.onchange=async()=>{const k=x.dataset.vk;await sb.from("variants").update({[k]:k=="active"?x.checked:k=="label"?x.value.trim():Number(x.value)}).eq("id",x.dataset.vi)});
 document.querySelectorAll("[data-vd]").forEach(b=>b.onclick=async()=>{if(confirm("Variant verwijderen?")){await sb.from("variants").delete().eq("id",b.dataset.vd);load()}});
 $("#nvr").onclick=async()=>{const sku=(prompt("SKU van het product (bijv. MS-01):")||"").trim().toUpperCase(),label=(prompt("Naam van de variant (bijv. Zwart):")||"").trim();if(!sku||!label)return;const stock=Number(prompt("Voorraad:")||0);const {error}=await sb.from("variants").insert({sku,label,stock});if(error)alert("Mislukt: controleer de SKU.");load()};
}
fetch("/.netlify/functions/shop").then(r=>r.json()).catch(()=>({})).then(c=>{c=c&&c.url?c:CFG;sb=supabase.createClient(c.url,c.key);boot()});
</script></body></html>
